<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>HaiA · 私信</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="feed.css"><link rel="stylesheet" href="conversation.css"><link rel="stylesheet" href="profile.css">
<link rel="stylesheet" href="chat-tools.css"><link rel="stylesheet" href="controls.css"><link rel="stylesheet" href="group-panel.css"><link rel="stylesheet" href="message-extras.css"><link rel="stylesheet" href="contact-details.css"><link rel="stylesheet" href="tools.css"><link rel="stylesheet" href="more-tools.css"><script defer src="visuals.js"></script><script defer src="avatar-photos.js"></script><script defer src="rail.js"></script><script defer src="feed.js"></script><script defer src="profile.js"></script><script defer src="thread-search.js"></script><script defer src="../shared/phone-number.js"></script><script defer src="link-panel.js"></script><script defer src="people-search.js"></script><script defer src="chat-translation.js"></script><script defer src="chat-messages.js"></script><script defer src="ui.js"></script><script defer src="message-media.js"></script><script defer src="message-actions.js"></script><script defer src="composer-extras.js"></script><script defer src="contact-details.js"></script><script defer src="account-health.js"></script><script defer src="chat-tools.js"></script><script defer src="more-tools.js"></script><script defer src="translation-settings.js"></script><script defer src="composer-tools.js"></script><script defer src="group-panel.js"></script><script defer src="account-menu.js"></script><script defer src="confirm-remove.js"></script>
</head><body>
<header class="topline"><i data-icon="chat"></i><strong>私信</strong></header>
<aside class="account-rail" aria-label="账号导航"><nav>
<button id="all" class="rail-button home" title="全部账号" aria-label="全部账号"><i data-icon="chat"></i></button>
<div class="rail-rule"></div><div id="accounts"></div>
<button id="add" class="rail-button add" title="添加账号" aria-label="添加账号"><i data-icon="plus"></i></button>
</nav><button id="health" hidden><i data-icon="pulse"></i><span id="health-count" hidden></span></button></aside>
<main><p role="status" id="warning" hidden></p><div id="call-bar" hidden></div>
<div id="workspace" class="work">
<section class="feed" aria-label="私信列表">
<div class="feed-top"><label class="search"><i data-icon="search"></i><input id="query" type="search" placeholder="查找对话" aria-label="搜索联系人、账号或最新消息"></label><button id="find-person" class="icon-button" title="搜索私聊账号" aria-label="搜索私聊账号"><i data-icon="person"></i></button><button id="open-status" class="icon-button" title="动态" aria-label="动态"><i data-icon="status"></i></button><button id="new-group" class="icon-button" title="新建群聊" aria-label="新建群聊"><i data-icon="plus"></i></button></div>
<div class="feed-filters"><button id="filter-all" aria-pressed="true"><i data-icon="inbox"></i>全部会话</button><button id="filter-unread" aria-pressed="false"><i data-icon="chat"></i>未读会话<span id="scope-unread" hidden></span></button><button id="filter-archived" aria-pressed="false"><i data-icon="archive"></i>已归档<span id="archived-count" hidden></span></button></div>
<div class="feed-heading"><h1 id="title">私信</h1><span id="feed-count" title="会话数"></span></div>
<div id="feed-scroll"><div id="list"></div><p id="feed-empty" hidden></p><button id="moreFeed" class="plain" hidden>加载更多会话</button></div>
<footer class="identity"><span id="dock-avatar" class="dock-icon"><i data-icon="inbox"></i></span><div><strong id="location">全部账号</strong><small id="connections"></small></div><button id="dock-search" class="icon-button" title="搜索私聊账号" aria-label="搜索私聊账号"><i data-icon="search"></i></button></footer></section>
<section class="reader">
<header id="reader-head"><button id="profile-toggle" class="chat-identity" aria-controls="profile" title="查看会话资料"><span id="reader-avatar" class="avatar"></span><span class="reader-title"><strong id="reader-title"></strong><span id="group-label" class="group-tag" hidden>群聊</span><small id="reader-phone" hidden></small><small id="presence" hidden></small></span></button><button id="remark-edit" class="icon-button" title="编辑备注" aria-label="编辑备注" hidden><i data-icon="edit"></i></button>
<div id="actions"><button id="call-voice" class="icon-button" title="语音通话" aria-label="语音通话" hidden><i data-icon="phone"></i></button><button id="call-video" class="icon-button" title="视频通话" aria-label="视频通话" hidden><i data-icon="video"></i></button><button id="group-directory" class="icon-button" aria-label="群组列表" data-tip="群组列表" hidden><i data-icon="groups"></i></button><button id="group-settings" class="icon-button" aria-label="群组设置" data-tip="群组设置" hidden><i data-icon="gear"></i></button><button id="translation-settings" class="icon-button" title="翻译设置" aria-label="翻译设置"><i data-icon="translate"></i></button></div>
<label id="thread-search" hidden><input id="message-query" type="search" placeholder="搜索当前聊天" aria-label="搜索已加载的聊天消息"><i data-icon="search"></i></label>
</header>
<div class="reader-body"><div class="timeline">
<div id="welcome" hidden><div class="welcome-mark"><i data-icon="chat"></i></div><h1>欢迎来到私信</h1><p>关联 WhatsApp 账号后，就可以在这里查看会话和回复消息。</p><button class="primary" id="first"><i data-icon="plus"></i>添加第一个账号</button></div>
<div id="match-status" hidden role="status"></div>

<div id="scroll"><div id="empty" hidden><div class="state-panel"><div class="state-copy"><i class="state-icon" data-icon="chat"></i><h2 id="emptyTitle"></h2><p id="help"></p><div id="pair-mode" hidden aria-label="选择关联方式"><button id="qr-mode" type="button">扫码</button><button id="code-mode" type="button">8 位关联码</button></div></div><div class="state-content">
<form id="phone-form" novalidate hidden><label for="phone">手机号（含国家区号）</label><input id="phone" type="tel" placeholder="例如 +65 8123 4567" autocomplete="off" required><button id="request-code" class="primary">获取关联码</button></form>
<output id="link-code" aria-live="polite" hidden></output><p id="link-status" role="status" hidden></p>
<img id="qr" hidden alt="此 WhatsApp 账号的关联设备二维码"><button id="preview-open" class="primary" hidden>打开对话</button></div></div></div><button id="more" class="plain" hidden>加载更早的消息</button><p id="chat-empty" hidden></p><div id="bubbles"></div></div>

<form id="composer" hidden><label id="replyLabel" for="reply"></label><div id="draft-proposal" hidden><p id="draft-result" dir="auto"></p><button type="button" id="apply-draft">使用译文</button><button type="button" id="dismiss-draft">保留原稿</button></div><div id="reply-context" hidden><span class="context-words"><strong id="context-label"></strong><span id="context-text"></span></span><button id="context-close" type="button" class="icon-button" title="取消" aria-label="取消"><i data-icon="close"></i></button></div><div id="attachments" hidden></div><div id="dictation" hidden><span id="dictation-status" role="status"></span><button id="dictation-language" type="button" title="语音输入设置"><i data-icon="gear"></i><span id="dictation-target"></span></button><button id="dictation-cancel" type="button">取消</button><button id="dictation-done" type="button">完成</button></div><div id="recording" hidden><span id="recording-time">0:00</span><button id="recording-cancel" type="button">取消</button><button id="recording-send" type="button">发送语音</button></div><div class="compose-inner"><button id="attach" type="button" class="icon-button" title="发送图片或文件" aria-label="发送图片或文件"><i data-icon="clip"></i></button><input id="attach-input" type="file" multiple hidden><button id="emoji-toggle" type="button" class="icon-button" popovertarget="emoji-picker" title="插入表情" aria-label="插入表情"><i data-icon="smile"></i></button><textarea id="reply" rows="1" maxlength="65536" placeholder="发送消息"></textarea><button id="dictate" type="button" class="icon-button" title="语音输入：说话后自动转成文字并翻译" aria-label="语音输入"><i data-icon="wave"></i></button><button id="record" type="button" class="icon-button" title="发送语音消息" aria-label="发送语音消息"><i data-icon="mic"></i></button><button id="draft-translate" type="button" class="icon-button" title="翻译草稿" aria-label="翻译草稿"><i data-icon="translate"></i></button><button id="send" class="icon-button" aria-label="发送消息" title="发送消息"><i data-icon="send"></i></button></div></form>
</div>
<section id="profile" aria-label="联系人资料" hidden><div class="profile-card"><div class="profile-banner"></div><span id="profile-avatar" class="avatar"></span><div class="profile-info"><h2 id="profile-name"></h2><span id="profile-kind"></span><div id="profile-details"></div><hr><dl><dt>来源账号</dt><dd id="profile-owner"></dd><dt>账号连接状态</dt><dd id="profile-status"></dd><dt>最近消息</dt><dd id="profile-date"></dd></dl></div><button id="profile-reply">在会话中回复</button></div></section></div>
</section></div></main>
<div id="emoji-picker" popover aria-label="选择表情"></div>
<div id="message-menu" popover role="menu" aria-label="消息操作"></div>
<dialog id="media-viewer" aria-label="查看图片"><img id="viewer-image" alt="图片"><footer><button id="viewer-save">保存到电脑</button><button id="viewer-close" autofocus>关闭</button></footer></dialog>
<dialog id="remark-dialog" aria-labelledby="remark-title"><form id="remark-form" novalidate><h2 id="remark-title">编辑备注</h2><p id="remark-hint"></p><label for="remark-name">备注</label><input id="remark-name" maxlength="80" autocomplete="off" placeholder="例如：新加坡代理 · 王先生"><div id="remark-error" role="alert"></div><footer><button type="button" id="remark-cancel">取消</button><button class="primary">保存</button></footer></form></dialog>
<dialog id="health-dialog" aria-labelledby="health-title"><div class="people-head"><h2 id="health-title">账号状态</h2><button id="health-close" aria-label="关闭">关闭</button></div><p id="health-summary"></p><div id="health-list"></div></dialog>
<dialog id="forward-dialog" aria-labelledby="forward-title"><div class="people-head"><h2 id="forward-title">转发消息</h2><button id="forward-close" aria-label="关闭">关闭</button></div><input type="search" id="forward-query" maxlength="100" placeholder="搜索会话" aria-label="搜索会话"><p id="forward-status" role="status"></p><div id="forward-results"></div></dialog>
<dialog id="create-group" aria-labelledby="create-group-title"><form id="create-group-form" novalidate><h2 id="create-group-title">新建群聊</h2><label for="group-owner">使用账号</label><select id="group-owner"></select><label for="group-name">群名称</label><input id="group-name" maxlength="100" autocomplete="off" placeholder="例如：华东代理群"><label for="group-members">成员手机号（含国家区号，每行一个）</label><textarea id="group-members" placeholder="+65 8123 4567&#10;+86 138 0013 8000"></textarea><div id="create-group-error" role="alert"></div><footer><button type="button" id="create-group-cancel">取消</button><button class="primary">创建群聊</button></footer></form></dialog>
<dialog id="voice-settings" aria-labelledby="voice-settings-title"><form id="voice-form" novalidate><h2 id="voice-settings-title">语音输入设置</h2><p>说完后，语音会先转成文字，再翻译成下面选择的语言并填入输入框，发送前可以修改。录音会发送给免费的语音识别服务，一个服务故障时自动换下一个。</p><label for="voice-language">语音译成</label><select id="voice-language"></select><div id="voice-error" role="alert"></div><footer><button type="button" id="voice-cancel">取消</button><button class="primary">保存</button></footer></form></dialog>
<div id="chat-menu" popover role="menu" aria-label="会话操作"></div>
<div id="attach-menu" popover role="menu" aria-label="选择要发送的内容"></div>
<dialog id="special-dialog" aria-labelledby="special-title"><form id="special-form" novalidate><h2 id="special-title"></h2><p id="special-hint"></p><div id="special-fields"></div><div id="special-error" role="alert"></div><footer><button type="button" id="special-cancel">取消</button><button class="primary">发送</button></footer></form></dialog>
<dialog id="status-dialog" aria-labelledby="status-title"><div class="people-head"><h2 id="status-title">动态</h2><button id="status-close" aria-label="关闭">关闭</button></div><label for="status-owner">账号</label><select id="status-owner"></select><form id="status-form" novalidate><textarea id="status-text" maxlength="700" placeholder="发布一条文字动态，或选择图片后填写说明" aria-label="动态内容"></textarea><div class="status-compose"><button type="button" id="status-image">选择图片</button><span id="status-image-name"></span><input id="status-image-input" type="file" accept="image/jpeg,image/png,image/webp" hidden><button class="primary">发布动态</button></div></form><p id="status-note" role="status"></p><div id="status-list"></div></dialog>
<dialog id="confirm-action" aria-labelledby="action-title"><h2 id="action-title"></h2><p id="action-detail"></p><footer><button id="action-cancel" autofocus>取消</button><button id="action-confirm" class="danger"></button></footer></dialog>
<div id="menu" popover role="menu" aria-label="账号操作"><strong id="menu-account"></strong><button id="account-details" role="menuitem"><i data-icon="person"></i>账号资料</button><button id="reload" role="menuitem"><i data-icon="refresh"></i>重新连接</button><button id="remove" role="menuitem"><i data-icon="trash"></i>移除账号</button></div>
<dialog id="account-dialog" aria-labelledby="account-name"><span id="account-photo" class="avatar"></span><h2 id="account-name"></h2><p id="account-phone"></p><p id="account-connection"></p><footer><button id="account-close">关闭</button></footer></dialog>
<dialog id="confirm-remove" aria-labelledby="remove-title"><h2 id="remove-title">移除账号</h2><p id="remove-detail"></p><footer><button id="remove-cancel" autofocus>取消</button><button id="remove-confirm" class="danger">移除账号</button></footer></dialog>
<dialog id="group-dialog" aria-labelledby="group-dialog-title"><div class="group-shell"><nav aria-label="群组导航"><button data-group-tab="list"><i data-icon="groups"></i>群组列表</button><button data-group-tab="members"><i data-icon="person"></i>群成员</button><button data-group-tab="settings"><i data-icon="gear"></i>群组设置</button></nav><section><header><h2 id="group-dialog-title"></h2><button id="group-close" class="icon-button" aria-label="关闭"><i data-icon="close"></i></button></header><p id="group-origin"></p><div id="group-panel-body"></div><p id="group-status" role="status"></p></section></div></dialog>
<dialog id="translation-dialog" aria-labelledby="translation-title"><form id="translation-form">
<h2 id="translation-title">翻译设置</h2>
<label class="auto-setting"><input id="auto-translate" type="checkbox">自动翻译当前聊天的可见来信</label>
<p>翻译时，消息或草稿会发送给所选翻译服务，失败时会尝试同模式的备用服务。译文显示在原文下方。</p>
<div class="language-pair"><label>消息译成<select id="incoming-language"></select></label><label>草稿译成<select id="draft-language"></select></label></div>
<label class="engine-field" for="translation-engine">翻译服务<select id="translation-engine"><option value="googleFree">免费 · Google 优先</option><option value="memory">免费 · MyMemory 优先</option><option value="apertium">免费 · Apertium 优先（部分欧洲语言）</option><option value="keyed">使用自己的 API Key</option></select></label>
<p id="engine-hint"></p><div id="keyed-settings">
<div id="provider-keys"></div><label for="azure-region">Azure 资源区域（如 eastasia）</label><input id="azure-region" placeholder="全局单服务资源可留空" maxlength="80">
</div><div id="translation-error" role="alert"></div><footer><button id="translation-cancel" type="button">取消</button><button class="primary">保存设置</button></footer></form></dialog>
<dialog id="people-dialog" aria-labelledby="people-title"><div class="people-head"><h2 id="people-title">搜索私聊账号</h2><button id="people-close" aria-label="关闭">关闭</button></div><label for="people-query">联系人姓名或手机号</label><input type="search" id="people-query" maxlength="100" placeholder="输入姓名或含国家区号的号码"><p id="people-status" role="status"></p><div id="people-results"></div></dialog>
<dialog id="dialog"><form id="newAccount" novalidate><img src="assets/whatsapp.svg" alt="" width="36" height="36"><h2>添加 WhatsApp 账号</h2><p>给号码起个容易辨认的名字，再扫码或用 8 位关联码登录。</p><label for="name">账号名称</label><input id="name" maxlength="48" autocomplete="off" placeholder="例如：新加坡客服" required aria-describedby="name-error"><div id="name-error" role="alert"></div><footer><button type="button" id="cancel">取消</button><button class="primary">继续</button></footer></form></dialog>
</body></html>
